<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="cazando.css" />
  <script src="utils.js"></script>
  <title>Juego Cazando</title>
</head>
<body onload="iniciar()">

  <h1>Juego Cazando</h1>
  <p>Autor: Christian Herrera</p>


  <canvas id="areaJuego" width="500px" height="500px"></canvas>

  <div class="controles">

    <button>⬅</button>

  </div>

  <p id="mensaje"></p>



  <script src="cazando.js"></script>
